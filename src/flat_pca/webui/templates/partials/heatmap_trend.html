{# Heatmap with the point sliders and the two trends; context from routes/heatmap_trend.py::heatmap_context. #}
{% if binned.binned %}
  <p class="warnings" data-binned>
    セル数が上限 {{ max_cells }} を超えるため、時間方向の {{ binned.source_rows }} 行を
    {{ binned.matrix.step_times|length }} 個のビンに平均して表示しています（トレンドはビニング前の値です）。
  </p>
{% endif %}
<div class="heatmap-panel">
  <div class="step-time-rail">
    <input type="range" id="explore-step-time" class="range-vertical" aria-label="StepTime">
  </div>
  <div id="explore-heatmap" class="plot plot-heatmap" data-heatmap-label="{{ heatmap_label }}"></div>
  <div class="wavelength-rail">
    <input type="range" id="explore-wavelength">
  </div>
  <div class="field-row explore-sliders">
    <label for="explore-wavelength">波長</label>
    <output id="explore-wavelength-value" for="explore-wavelength"></output>
  </div>
</div>
<div class="plot-grid">
  <div id="explore-trend-step-time" class="plot"></div>
  <div id="explore-trend-wavelength" class="plot"></div>
</div>
<script type="application/json" id="explore-heatmap-figure">{{ figure_json|safe }}</script>
<script type="application/json" id="explore-axes">{{ axes_json|safe }}</script>
