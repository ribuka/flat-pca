{% for name, values in options.items() %}
  {% set current = current_values.get(name, "") %}
  <label>{{ name }}
    <select name="eq__{{ name }}">
      <option value="">(すべて)</option>
      {% for value in values %}
        <option value="{{ value }}" {% if value == current %}selected{% endif %}>{{ value }}</option>
      {% endfor %}
      {% if current and current not in values %}
        <option value="{{ current }}" selected>{{ current }}</option>
      {% endif %}
    </select>
  </label>
{% endfor %}
