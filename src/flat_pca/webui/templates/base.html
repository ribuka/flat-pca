<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}flat-pca{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}"></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">flat-pca</div>
      <nav class="sidebar-nav" aria-label="画面">
        <ul>
          {% for item in nav_items %}
            {% if item.path is none %}
              <li><span class="nav-item nav-disabled" aria-disabled="true" title="未実装">{{ item.label }}</span></li>
            {% elif item.path == request.url.path %}
              <li><a class="nav-item nav-current" href="{{ item.path }}" aria-current="page">{{ item.label }}</a></li>
            {% else %}
              <li><a class="nav-item" href="{{ item.path }}">{{ item.label }}</a></li>
            {% endif %}
          {% endfor %}
        </ul>
      </nav>
      <div id="sidebar-status" class="sidebar-status"
           hx-get="/sidebar/status" hx-target="this" hx-swap="innerHTML"
           hx-trigger="load, catalog-started from:body, catalog-updated from:body, selection-updated from:body">
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
