[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flat_pca"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru==0.7.3",
    "numpy==2.5.3",
    "plotly==7.0.0",
    "polars==1.44.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.optional-dependencies]
webui = [
    "duckdb==1.5.6",
    "fastapi==0.142.2",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "flat-pca[webui]",
    "httpx2==2.13.1",
    "ipykernel==7.3.0",
    "nbformat==5.11.1",
    "pylint==4.0.8",
    "pytest==9.1.1",
    "pytest-playwright==0.9.0",
    "ruff==0.16.7",
]
wiggum = [
    "wiggum",
]

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/flat_pca"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.sources]
wiggum = { git = "https://github.com/ribuka/wiggum.git" }
flat-pca = { workspace = true }

[tool.pytest.ini_options]
norecursedirs = [".*", "tmp"]
# E2E tests drive the installed Chrome; select them with `-m e2e`.
addopts = ["-m", "not e2e", "--browser-channel", "chrome"]
markers = ["e2e: browser tests of the Web UI (run with `-m e2e`)"]
