{% extends "base.html" %}
{% block title %}前処理・PCA - flat-pca{% endblock %}
{% block content %}
<section>
  <h2>前処理・PCA</h2>
  <p>
    対象：選択中の <strong data-selected-count="{{ selected_count }}">{{ selected_count }}</strong> ファイル
    （<a href="/">データ選択</a>で変更できます）
  </p>
  {% include "partials/fit_form.html" %}
</section>

<section>
  <h2>実行状況</h2>
  <div id="fit-run-status">{% include "partials/fit_run_status.html" %}</div>
</section>

<section>
  <h2>run 一覧</h2>
  <div id="fit-runs" hx-get="/fit/runs" hx-target="this" hx-swap="innerHTML"
       hx-trigger="load, fit-started from:body, fit-updated from:body">
    <p class="muted">読み込み中…</p>
  </div>
</section>
{% endblock %}
